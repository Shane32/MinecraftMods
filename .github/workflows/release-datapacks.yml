name: Package and Release Datapacks

on:
  release:
    types: [published]

jobs:
  package-datapacks:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      
      - name: Install dependencies
        run: npm install
      
      - name: Package packs
        run: npm run pack
      
      - name: Upload release assets
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const distDir = 'dist';
            
            if (!fs.existsSync(distDir)) {
              console.log('No dist directory found');
              return;
            }
            
            const zipFiles = fs.readdirSync(distDir)
              .filter(file => file.endsWith('.zip'));
            
            console.log(`Found ${zipFiles.length} zip file(s) to upload`);
            
            for (const zipFile of zipFiles) {
              const zipPath = path.join(distDir, zipFile);
              const fileContent = fs.readFileSync(zipPath);
              
              try {
                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: context.payload.release.id,
                  name: zipFile,
                  data: fileContent
                });
                
                console.log(`Uploaded ${zipFile}`);
              } catch (error) {
                console.error(`Failed to upload ${zipFile}:`, error.message);
              }
            }
            
            console.log('Release asset upload complete!');
